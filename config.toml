# Non-root patched YouTube + YouTube Music via Morphe patches
# Build with j-hc/revanced-magisk-module, build-mode = "apk"
#
# YouTube build is DISABLED here (already built and delivered).
# Only YouTube Music is built now.

[YouTube-Morphe]
enabled = false

# ---------------------------------------------------------------------------
# YouTube Music — stock look and behaviour, ad-free, WITH Google login
# ---------------------------------------------------------------------------
[Music-Morphe]
app-name = "Music"
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"

# Non-root APK only.
build-mode = "apk"

# Pinned stock version. Morphe supports YTM 9.20.53 and 9.15.51 as stable
# (9.40.51 / 9.39.52 / 9.38.51 are experimental). 9.20.53 is the newest
# stable and is present on the archive mirror as an arm64-v8a split.
version = "9.20.53"

arch = "arm64-v8a"

# j-hc archive.org mirror. APKMirror returns 403 to GitHub Actions IPs, which
# killed the first YouTube build. dl_archive prefers <ver>-<arch> and falls
# back to <ver>-all; for YTM the mirror has the exact 9.20.53-arm64-v8a file.
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"

enable-update-checks = true

# Apply exactly the listed patches. Deliberately NOT included, so the app
# keeps stock look and behaviour: Custom branding, Change header, Theme,
# Change start page, Hide layout components, Hide buttons, Hide flyout menu
# components, Hide music action buttons, Navigation bar, Change miniplayer
# color, Force portrait orientation, Playback speed, Skip silence, Crossfade.
exclusive-patches = true

# "GmsCore support" is forced on for non-root builds regardless; listed for
# clarity. It renames the package so the app installs alongside stock and
# talks to MicroG-RE for Google login.
included-patches = "'Hide ads' 'SponsorBlock' 'Return YouTube Dislike' 'Remove background playback restrictions' 'Enable exclusive audio playback' 'GmsCore support'"
