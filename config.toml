# Non-root patched YouTube via Morphe patches
# Build with j-hc/revanced-magisk-module, build-mode = "apk"
# Target: YouTube 21.20.405, arm64-v8a

[YouTube-Morphe]
app-name = "YouTube"
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"

# Non-root APK only. "module" would be a Magisk module; "both" ships both.
build-mode = "apk"

# Pinned stock version. "auto" would pick the newest version all patches support.
version = "21.20.405"

arch = "arm64-v8a"

# Builder downloads the stock APK itself from here. No manual download needed.
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"

enable-update-checks = true

# Apply exactly the listed patches and nothing else. If the build errors on a
# missing dependency, add the named patch to this list and rebuild.
exclusive-patches = true

# Patch display names, verbatim from MorpheApp/morphe-patches.
# Note: "GmsCore support" is forced on for non-root builds regardless.
included-patches = "'Hide ads' 'SponsorBlock' 'Return YouTube Dislike' 'Swipe controls' 'Remove background playback restrictions' 'Hide Shorts components' 'Navigation bar' 'Disable Shorts resuming on startup' 'Custom branding' 'Hide layout components' 'DeArrow' 'GmsCore support'"
